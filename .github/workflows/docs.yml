name: Docs

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: ["lib/**", "guides/**", "README.md", "mix.exs"]

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: dev

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "28"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: docs-1.20-28-${{ hashFiles('mix.lock') }}
          restore-keys: docs-1.20-28-

      - name: Install dependencies
        run: mix deps.get

      - name: Build docs
        run: mix docs

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc

  deploy:
    name: Deploy to Pages
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4